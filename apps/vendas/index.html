<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="splash-screen" id="splashScreen">
        <div class="loader"></div>
    </div>

    <div class="app-content" id="mainView">
        <div class="container">
            <div class="header">
                <div class="header-left">
                    <h1>Vendas</h1>
                    <div id="connectionStatus" class="connection-status offline">
                        <span class="status-dot"></span>
                    </div>
                </div>
            </div>

            <!-- Dashboard Cards -->
            <div class="dashboard-grid">
                <div class="stat-card stat-card-success" id="cardPago" onclick="abrirModalPago()" style="cursor:pointer;" title="Clique para ver detalhes">
                    <div class="stat-icon stat-icon-success">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value stat-value-success" id="totalPago">R$ 0,00</div>
                        <div class="stat-label">Pago</div>
                    </div>
                </div>
                <div class="stat-card stat-card-warning" id="cardAReceber" onclick="abrirModalAReceber()" style="cursor:pointer;" title="Clique para ver detalhes">
                    <div class="stat-icon stat-icon-warning">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value stat-value-warning" id="totalAReceber">R$ 0,00</div>
                        <div class="stat-label">A Receber</div>
                    </div>
                </div>
                <!-- Ícone único: caminhão (movido do card Valor Frete para cá) -->
                <div class="stat-card stat-card-danger" id="cardForaPrazo" onclick="abrirModalForaPrazo()" style="cursor:pointer;" title="Clique para ver detalhes">
                    <div class="stat-icon stat-icon-danger">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="1" y="3" width="15" height="13"></rect>
                            <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                            <circle cx="5.5" cy="18.5" r="2.5"></circle>
                            <circle cx="18.5" cy="18.5" r="2.5"></circle>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value stat-value-danger" id="totalForaPrazo">0</div>
                        <div class="stat-label">Fora do Prazo</div>
                    </div>
                </div>
                <!-- Ícone único: caixa/pacote com vistinho -->
                <div class="stat-card stat-card-info">
                    <div class="stat-icon stat-icon-info">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                            <line x1="12" y1="22.08" x2="12" y2="12"></line>
                            <polyline points="8.3 13.5 10.6 15.8 15.2 10.6" stroke-width="2.3"></polyline>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value stat-value-info" id="totalEntregue">0</div>
                        <div class="stat-label">Entregue</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon stat-icon-default">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="1" x2="12" y2="23"></line>
                            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value" id="totalFaturado">R$ 0,00</div>
                        <div class="stat-label">Faturado</div>
                    </div>
                </div>
                <!-- Ícone único: caminhão com $ -->
                <div class="stat-card stat-card-info">
                    <div class="stat-icon stat-icon-info">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="1" y="3" width="15" height="13"></rect>
                            <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                            <circle cx="5.5" cy="18.5" r="2.5"></circle>
                            <circle cx="18.5" cy="18.5" r="2.5"></circle>
                            <text x="8.5" y="11.8" font-size="7.5" font-weight="800" fill="currentColor" stroke="none" text-anchor="middle" font-family="Arial, sans-serif">$</text>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value stat-value-info" id="totalValorFrete">R$ 0,00</div>
                        <div class="stat-label">Valor Frete</div>
                    </div>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="search-bar-wrapper">
                <div class="search-bar">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input type="text" id="search" placeholder="Pesquisar por NF, órgão, vendedor, cidade..." oninput="filterVendas()">

                    <div class="search-bar-filters">
                        <div class="filter-dropdown-inline">
                            <select id="filterVendedor" onchange="filterVendas()">
                                <option value="">Todos os Vendedores</option>
                                <option value="ROBERTO">Roberto</option>
                                <option value="ISAQUE">Isaque</option>
                                <option value="MIGUEL">Miguel</option>
                            </select>
                            <svg class="dropdown-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                        <div class="filter-dropdown-inline">
                            <select id="filterStatus" onchange="filterVendas()">
                                <option value="">Todos os Status</option>
                                <option value="PAGO">Pago</option>
                                <option value="PARCELA">Parcela em Aberto</option>
                                <option value="ENTREGUE">Entregue</option>
                                <option value="EM TRÂNSITO">Em Trânsito</option>
                                <option value="AGUARDANDO COLETA">Aguardando Coleta</option>
                                <option value="FORA DO PRAZO">Fora do Prazo</option>
                                <option value="EXTRAVIADO">Extraviado</option>
                                <option value="DEVOLVIDO">Devolvido</option>
                                <option value="SIMPLES REMESSA">Simples Remessa</option>
                                <option value="REMESSA DE AMOSTRA">Remessa de Amostra</option>
                            </select>
                            <svg class="dropdown-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                        <div class="month-navigation-inline">
                            <button onclick="changeMonth(-1)" class="month-nav-arrow" title="Mês anterior">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="15 18 9 12 15 6"></polyline>
                                </svg>
                            </button>
                            <div class="month-display-inline">
                                <span id="currentMonth">Carregando...</span>
                            </div>
                            <button onclick="changeMonth(1)" class="month-nav-arrow" title="Próximo mês">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="9 18 15 12 9 6"></polyline>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button class="calendar-btn" onclick="toggleCalendar()" title="Selecionar mês">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </button>
                    <button class="calendar-btn chart-btn" onclick="abrirPainelGeral()" title="Painel Geral">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="20" x2="18" y2="10"></line>
                            <line x1="12" y1="20" x2="12" y2="4"></line>
                            <line x1="6" y1="20" x2="6" y2="14"></line>
                        </svg>
                    </button>
                    <button class="calendar-btn" id="syncBtn" onclick="syncDataManual()" title="Sincronizar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <polyline points="1 20 1 14 7 14"></polyline>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Calendar Modal -->
            <div class="calendar-modal" id="calendarModal">
                <div class="calendar-content">
                    <div class="calendar-header">
                        <button onclick="changeCalendarYear(-1)" class="calendar-year-nav">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg>
                        </button>
                        <h3 id="calendarYear">2026</h3>
                        <button onclick="changeCalendarYear(1)" class="calendar-year-nav">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </button>
                    </div>
                    <div class="calendar-months" id="calendarMonths"></div>
                </div>
            </div>

            <!-- Table Card -->
            <div class="card table-card">
                <div id="vendasContainer"></div>
            </div>
        </div>
    </div>

    <!-- MODAL DE VISUALIZAÇÃO (abas) -->
    <div class="modal-overlay" id="infoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">NF Nº <span id="modalNumeroNF"></span></h3>
                <button class="close-modal" onclick="closeInfoModal()">✕</button>
            </div>

            <div class="tabs-container">
                <div class="tabs-nav">
                    <button class="tab-btn active" onclick="switchInfoTab(0, this)">Geral</button>
                    <button class="tab-btn" onclick="switchInfoTab(1, this)">Controle de Frete</button>
                    <button class="tab-btn" onclick="switchInfoTab(2, this)">Contas a Receber</button>
                    <button class="tab-btn" onclick="switchInfoTab(3, this)">Observações</button>
                </div>
                <div class="tab-content active" id="infoTabGeral"></div>
                <div class="tab-content" id="infoTabFrete"></div>
                <div class="tab-content" id="infoTabReceber"></div>
                <div class="tab-content" id="infoTabObs"></div>
            </div>

            <div class="modal-actions">
                <button type="button" onclick="closeInfoModal()" class="secondary">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MODAL FORA DO PRAZO -->
    <div class="modal-overlay" id="foraPrazoModal" style="display:none;">
        <div class="modal-content alert-modal">
            <div class="modal-header-alert">
                <h3 class="modal-title">NFs Fora do Prazo</h3>
                <button class="close-modal" onclick="closeModalGenerico('foraPrazoModal')">✕</button>
            </div>
            <div class="modal-body" id="foraPrazoModalBody"></div>
            <div class="modal-actions-alert">
                <button type="button" onclick="closeModalGenerico('foraPrazoModal')" class="secondary">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MODAL PAGO -->
    <div class="modal-overlay" id="pagoModal" style="display:none;">
        <div class="modal-content alert-modal">
            <div class="modal-header-alert">
                <h3 class="modal-title">NFs Pagas no Mês</h3>
                <button class="close-modal" onclick="closeModalGenerico('pagoModal')">✕</button>
            </div>
            <div class="modal-body" id="pagoModalBody"></div>
            <div class="modal-actions-alert">
                <button type="button" onclick="closeModalGenerico('pagoModal')" class="secondary">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MODAL A RECEBER -->
    <div class="modal-overlay" id="aReceberModal" style="display:none;">
        <div class="modal-content alert-modal">
            <div class="modal-header-alert">
                <h3 class="modal-title">NFs A Receber</h3>
                <button class="close-modal" onclick="closeModalGenerico('aReceberModal')">✕</button>
            </div>
            <div class="modal-body" id="aReceberModalBody"></div>
            <div class="modal-actions-alert">
                <button type="button" onclick="closeModalGenerico('aReceberModal')" class="secondary">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MODAL PAINEL GERAL -->
    <!-- Toggle Geral/Individual removido: o painel agora sempre segue o
         filtro de Vendedores selecionado na tela principal. -->
    <div class="modal-overlay" id="painelModal" style="display:none;">
        <div class="modal-content painel-modal">
            <div class="modal-header">
                <h3 class="modal-title">Painel Geral <span id="painelVendedorLabel"></span></h3>
                <button class="close-modal" onclick="closeModalGenerico('painelModal')">✕</button>
            </div>

            <div class="painel-year-nav">
                <button onclick="mudarAnoPainel(-1)">‹</button>
                <span class="painel-year-label" id="painelYearLabel">2026</span>
                <button onclick="mudarAnoPainel(1)">›</button>
            </div>

            <div class="tabs-container">
                <div class="tabs-nav">
                    <button class="tab-btn active" onclick="switchPainelTab('geral', this)">Geral</button>
                    <button class="tab-btn" onclick="switchPainelTab('faturamento', this)">Faturamento</button>
                    <button class="tab-btn" onclick="switchPainelTab('frete', this)">Frete Total</button>
                    <button class="tab-btn" onclick="switchPainelTab('receber', this)">A Receber</button>
                </div>
                <div class="tab-content active" id="painelTabGeral"></div>
                <div class="tab-content" id="painelTabFaturamento"></div>
                <div class="tab-content" id="painelTabFrete"></div>
                <div class="tab-content" id="painelTabReceber"></div>
            </div>

            <div class="modal-actions">
                <button type="button" onclick="closeModalGenerico('painelModal')" class="secondary">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            const splash = document.getElementById('splashScreen');
            if (splash) splash.style.display = 'none';
        }, 3000);
    </script>
    <script src="script.js"></script>
</body>
</html>
